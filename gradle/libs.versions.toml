[versions]
archunit = "1.4.1"
assertj = "3.27.7"
junit = "6.0.3"
mockito = "5.23.0"
spring-boot = "4.1.1"
spring-cloud-aws = "4.1.1"
spring-dependency-management = "1.1.7"
uuid-creator = "6.1.1"

[libraries]
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
flyway-database-postgresql.module = "org.flywaydb:flyway-database-postgresql"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter.module = "org.junit.jupiter:junit-jupiter"
junit-platform-launcher.module = "org.junit.platform:junit-platform-launcher"
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
postgresql-driver.module = "org.postgresql:postgresql"
spring-boot-starter-actuator.module = "org.springframework.boot:spring-boot-starter-actuator"
spring-boot-starter-data-jpa.module = "org.springframework.boot:spring-boot-starter-data-jpa"
spring-boot-starter-flyway.module = "org.springframework.boot:spring-boot-starter-flyway"
spring-boot-starter-oauth2-resource-server.module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
spring-boot-starter-validation.module = "org.springframework.boot:spring-boot-starter-validation"
spring-boot-starter-webmvc.module = "org.springframework.boot:spring-boot-starter-webmvc"
spring-boot-test-actuator.module = "org.springframework.boot:spring-boot-starter-actuator-test"
spring-boot-test-data-jpa.module = "org.springframework.boot:spring-boot-starter-data-jpa-test"
spring-boot-test-flyway.module = "org.springframework.boot:spring-boot-starter-flyway-test"
spring-boot-test-testcontainers.module = "org.springframework.boot:spring-boot-testcontainers"
spring-boot-test-validation.module = "org.springframework.boot:spring-boot-starter-validation-test"
spring-boot-test-webmvc.module = "org.springframework.boot:spring-boot-starter-webmvc-test"
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
spring-cloud-aws-starter-sns.module = "io.awspring.cloud:spring-cloud-aws-starter-sns"
spring-cloud-aws-starter-sqs.module = "io.awspring.cloud:spring-cloud-aws-starter-sqs"
spring-security-test.module = "org.springframework.security:spring-security-test"
testcontainers-junit-jupiter.module = "org.testcontainers:testcontainers-junit-jupiter"
testcontainers-localstack.module = "org.testcontainers:testcontainers-localstack"
testcontainers-postgresql.module = "org.testcontainers:testcontainers-postgresql"
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
