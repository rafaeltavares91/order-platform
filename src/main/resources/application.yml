spring:
  application:
    name: order-platform
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_platform}
    username: ${DB_USERNAME:order_platform}
    password: ${DB_PASSWORD:order_platform}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
  cloud:
    aws:
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/order-platform}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/order-platform/protocol/openid-connect/certs}

order-platform:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    order-events-topic-arn: ${ORDER_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:order-events}
    payment-confirmed-queue: ${PAYMENT_CONFIRMED_QUEUE:order-payment-confirmed}
    outbox:
      batch-size: ${OUTBOX_BATCH_SIZE:20}
      poll-delay: ${OUTBOX_POLL_DELAY:1000}
  security:
    audience: ${OIDC_AUDIENCE:order-platform-api}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
