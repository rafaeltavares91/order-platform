services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: order_platform
      POSTGRES_USER: order_platform
      POSTGRES_PASSWORD: order_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_platform -d order_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

volumes:
  postgres-data:
